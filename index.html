<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a0c10">
  <title>PLINKO 彈珠台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" id="back" href="https://acc2023156.github.io/Boss88VIP/boss88-mobile-lobby.html" data-i18n-title="back">
      <span aria-hidden="true">‹</span><span data-i18n="back">返回大廳</span>
    </a>
    <h1 class="logo">PLINKO</h1>
    <div class="wallet">
      <span class="coin" aria-hidden="true">$</span>
      <strong id="balance">0.00</strong>
      <button class="refill" id="refill" type="button" data-i18n-title="refill">↻</button>
      <button class="sound" id="sound" type="button" data-i18n-title="sound">🔊</button>
    </div>
  </header>

  <main class="layout">
    <section class="board-card">
      <canvas id="board"></canvas>
      <ol class="history" id="history" data-i18n-title="history"></ol>
    </section>

    <section class="panel controls">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab active" data-mode="manual" data-i18n="manual">手動</button>
        <button type="button" role="tab" class="tab" data-mode="auto" data-i18n="auto">自動</button>
      </div>

      <label class="field">
        <span class="field-label" data-i18n="betAmount">投注金額</span>
        <div class="bet-row">
          <input id="betAmount" type="number" inputmode="decimal" min="0" step="0.01" value="1.00">
          <button type="button" class="chip" id="half" data-i18n="half">½</button>
          <button type="button" class="chip" id="double" data-i18n="double">2×</button>
        </div>
      </label>

      <div class="field-pair">
        <label class="field">
          <span class="field-label" data-i18n="risk">風險</span>
          <select id="risk">
            <option value="low" data-i18n="riskLow">低</option>
            <option value="medium" data-i18n="riskMedium">中</option>
            <option value="high" data-i18n="riskHigh">高</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label" data-i18n="rows">列數</span>
          <select id="rows"></select>
        </label>
      </div>

      <label class="field auto-only">
        <span class="field-label"><span data-i18n="numberOfBets">投注次數</span><small data-i18n="infiniteHint">0 為無限次</small></span>
        <input id="numberOfBets" type="number" inputmode="numeric" min="0" step="1" value="10">
      </label>

      <button type="button" class="bet-btn" id="betBtn" data-i18n="bet">投注</button>
    </section>

    <section class="panel stats">
      <div class="stats-head">
        <h2 data-i18n="liveStats">即時統計</h2>
        <button type="button" class="link-btn" id="resetStats" data-i18n="reset">重設</button>
      </div>
      <dl class="stats-grid">
        <div><dt data-i18n="profit">盈利</dt><dd id="statProfit">0.00</dd></div>
        <div><dt data-i18n="wins">勝</dt><dd id="statWins" class="pos">0</dd></div>
        <div><dt data-i18n="wagered">總投注</dt><dd id="statWagered">0.00</dd></div>
        <div><dt data-i18n="losses">負</dt><dd id="statLosses" class="neg">0</dd></div>
      </dl>
      <canvas id="chart" class="chart"></canvas>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/board.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
